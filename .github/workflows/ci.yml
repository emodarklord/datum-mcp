name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline:
    # Hosted runners have no SOLIDWORKS, so only the projects without COM interop build here.
    # The full solution and live tests run on a machine with SOLIDWORKS installed.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet format tests/Datum.Tests --verify-no-changes
      - run: dotnet build tests/Datum.Tests -c Release
      - run: dotnet test tests/Datum.Tests -c Release --no-build
